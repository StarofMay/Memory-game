<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match the Tile</title>
    <link rel="icon" type="image/png" href="man1.png">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-image: url('bg_blue.jpg');
        background-size: cover;
        font-family: 'Nunito', sans-serif;
    }
    .container {
            width: 80%;
            text-align: center;
            color: white;
        }

        /* Screen Toggling */
        .screen {
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        .active {
            display: flex; /* Only show active screen */
        }

        h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            margin-bottom: 20px;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.2);
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 15px 30px;
            min-width: 120px;
            background-color: #ffffff;
            color:  #4885ff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button img {
            width: 80px;
            height: 80px;
            margin-right: 10px;
            vertical-align: middle;
        }

        button:hover {
            background-color:  #4885ff;
            color: #ffffff;
            transform: translateY(-3px);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgb(255, 255, 255);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="title-screen" class="screen active">
            <h1>Match the Tile</h1>
            <button onclick="showMenu()">START</button>
        </div>

        <div id="menu-screen" class="screen">
            <h1>Select Level</h1>
            <div class="btn-group">
                <button onclick="window.location.href='level_one.html'"><img src="man1.png" alt="Level 1">Level 1</button>
                <button onclick="window.location.href='level_two.html'"><img src="cos1.png" alt="Level 2">Level 2</button>
                <button onclick="window.location.href='level_three.html'"><img src="nat1.png" alt="Level 3">Level 3</button>
                <button onclick="window.location.href='level_four.html'"><img src="space1.png" alt="Level 4">Level 4</button>
            </div>
            <p style="margin-top: 20px; cursor:pointer;" onclick="showTitle()"> Back</p>
        </div>
    </div>

    <div class="footer">
        <p>Created in 2026, Bernados, Czarinah Mae</p>
    </div>

    <script>
        function showMenu() {
            document.getElementById('title-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
        }

        function showTitle() {
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('title-screen').classList.add('active');
        }
    </script>
</body>
</html>
